name: Build QuarkFinder APK

on:
  push:
    branches: [main]
    paths:
      - "quarkfinder/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/quarkfinder-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build QuarkFinder debug APK
        run: bash ./gradlew :quarkfinder:assembleDebug --stacktrace
      - name: Upload QuarkFinder APK
        uses: actions/upload-artifact@v4
        with:
          name: QuarkFinder-debug
          path: quarkfinder/build/outputs/apk/debug/*.apk
          if-no-files-found: error
