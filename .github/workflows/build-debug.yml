name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install TurboDL Maven artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.m2/repository" /tmp/turbodl-maven
          curl --fail --location --retry 3 \
            "https://github.com/jiayuxuan123/TurboDL/releases/download/v0.3.1.0/TurboDL-v0.3.1.0-mavenLocal.zip" \
            --output /tmp/turbodl-mavenLocal.zip
          unzip -l /tmp/turbodl-mavenLocal.zip | head -40
          unzip -q /tmp/turbodl-mavenLocal.zip -d /tmp/turbodl-maven
          mkdir -p "$HOME/.m2/repository/dev/turbodl"
          cp -a /tmp/turbodl-maven/. "$HOME/.m2/repository/dev/turbodl/"
          test -f "$HOME/.m2/repository/dev/turbodl/turbodl-core/0.3.1.0/turbodl-core-0.3.1.0.pom"
          find "$HOME/.m2/repository/dev/turbodl" -maxdepth 3 -type f | head -40
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YunGet-Checkin-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
